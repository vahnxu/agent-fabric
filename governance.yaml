schema_version: 1

project: agent-fabric
type: minimal

visibility: public

durable_remote: origin
public_mirror: vahnxu/agent-fabric

checks:
  onboarding_gate: true
  git_hooks_armed: true
  governance_consistency: true
  negative_test_coverage: true
  autosync_governance: false
  deploy_runbook: false
  acceptance_smoke: false

governance_scripts:
  - ops/check_release_governance_consistency.sh
  - ops/check_negative_test_coverage.py
  - ops/enforce_agent_onboarding_gate.sh
  - ops/sync_agent_instructions.sh
  - ops/install_git_hooks.sh

sync:
  truth_source: durable_remote
  autosync: true
